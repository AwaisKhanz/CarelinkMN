[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = ["pnpm --filter @carelink/database db:generate", "pnpm build"]

[start]
cmd = "node packages/api/dist/index.js & (cd apps/web && node_modules/.bin/next start)"

[variables]
NODE_ENV = "production"
