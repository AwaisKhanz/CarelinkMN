[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = ["pnpm --filter @carelink/database db:generate", "pnpm build", "cd apps/web && pnpm next build"]

[start]
cmd = "PORT=3000 node packages/api/dist/index.js"

[variables]
NODE_ENV = "production"
